# Alembic 설정 (DB 문서 §9)
# 접속 URL은 여기에 적지 않는다 — migrations/env.py 가 config/settings.py 에서 읽는다.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# {순번4자리}_{동사}_{대상}
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
