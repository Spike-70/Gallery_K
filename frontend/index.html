<!doctype html>
<html lang="ko" data-font-scale="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      본문 폰트 (디자인 시스템 §4.1). CSS 파싱을 기다리지 않고 바로 받는다 —
      늦게 도착하면 글자가 한 번 갈아끼워지며 화면이 흔들린다(CLS).
      자체 호스팅이므로 `crossorigin`은 필수다(폰트는 익명 CORS로 받는다).
    -->
    <link
      rel="preload"
      href="/fonts/PretendardVariable.subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA — 홈 화면 추가·오프라인 캐시 (프런트엔드 문서 §10.5) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS는 매니페스트 아이콘을 쓰지 않는다. 홈 화면 추가 안내(§6.4)가 이 아이콘에 의존한다. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="갤러리 K" />

    <title>갤러리 K</title>
    <meta name="description" content="매일 아침 12점의 그림이 걸리는 작은 미술관" />
    <!-- 폐쇄형 서비스다. 검색에 노출하지 않는다(PRD §8.4). -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#faf9f7" />

    <!-- OG에는 제목·설명과 정문 이미지만 넣는다. **작품 이미지는 절대 넣지 않는다.** -->
    <meta property="og:title" content="갤러리 K" />
    <meta property="og:description" content="매일 아침 12점의 그림이 걸리는 작은 미술관" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
